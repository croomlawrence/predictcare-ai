<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F7F4EC"/><stop offset="1" stop-color="#EEF3FF"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#080A0F" flood-opacity="0.14"/></filter>
    <style>
      .title{font:900 58px Inter,Arial,sans-serif;fill:#080A0F}
      .h2{font:800 34px Inter,Arial,sans-serif;fill:#080A0F}
      .body{font:600 22px Inter,Arial,sans-serif;fill:#6B6258}
      .small{font:700 18px Inter,Arial,sans-serif;fill:#6B6258}
      .pill{font:800 17px Inter,Arial,sans-serif;letter-spacing:.12em;fill:#0F8F72}
    </style>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>
  <circle cx="1120" cy="100" r="190" fill="#345CFF" opacity=".08"/>
  <circle cx="120" cy="660" r="260" fill="#0F8F72" opacity=".08"/>
  
  <text x="70" y="84" class="pill">THE CORE PROBLEM</text>
  <text x="70" y="152" class="title">Scattered AI creates drift.</text>
  <text x="70" y="205" class="body">A Single Brain creates alignment.</text>
  <g transform="translate(85 280)">
    <rect x="0" y="0" width="116" height="70" rx="18" fill="white" filter="url(#shadow)"/><text x="24" y="44" class="small">LLM 1</text><rect x="145" y="54" width="116" height="70" rx="18" fill="white" filter="url(#shadow)"/><text x="169" y="98" class="small">LLM 2</text><rect x="290" y="0" width="116" height="70" rx="18" fill="white" filter="url(#shadow)"/><text x="314" y="44" class="small">LLM 3</text><rect x="435" y="54" width="116" height="70" rx="18" fill="white" filter="url(#shadow)"/><text x="459" y="98" class="small">LLM 4</text><rect x="580" y="0" width="116" height="70" rx="18" fill="white" filter="url(#shadow)"/><text x="604" y="44" class="small">LLM 5</text>
    <path d="M30 185 C180 130,260 230,410 174 S640 90,780 210" fill="none" stroke="#c94f4f" stroke-width="8" stroke-dasharray="18 16"/>
    <text x="10" y="260" class="body">Plans multiply · legal reads conflict · teams drift</text>
  </g>
  <g transform="translate(770 285)" filter="url(#shadow)">
    <rect width="390" height="230" rx="36" fill="white"/>
    <circle cx="80" cy="95" r="44" fill="#345CFF"/>
    <circle cx="80" cy="95" r="18" fill="#FFD22E"/>
    <text x="145" y="82" class="h2">Single Brain</text>
    <text x="145" y="122" class="body">One plan</text>
    <text x="145" y="156" class="body">One decision log</text>
    <text x="145" y="190" class="body">One governed workflow</text>
  </g>

</svg>