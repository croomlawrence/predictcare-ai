<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F7F4EC"/><stop offset="1" stop-color="#EEF3FF"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#080A0F" flood-opacity="0.14"/></filter>
    <style>
      .title{font:900 58px Inter,Arial,sans-serif;fill:#080A0F}
      .h2{font:800 34px Inter,Arial,sans-serif;fill:#080A0F}
      .body{font:600 22px Inter,Arial,sans-serif;fill:#6B6258}
      .small{font:700 18px Inter,Arial,sans-serif;fill:#6B6258}
      .pill{font:800 17px Inter,Arial,sans-serif;letter-spacing:.12em;fill:#0F8F72}
    </style>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>
  <circle cx="1120" cy="100" r="190" fill="#345CFF" opacity=".08"/>
  <circle cx="120" cy="660" r="260" fill="#0F8F72" opacity=".08"/>
  
  <text x="70" y="84" class="pill">THE OPERATING SYSTEM</text>
  <text x="70" y="148" class="title">The Healthcare Intelligence Stack</text>
  <g transform="translate(100 220)">
    <rect x="0" y="0" width="760" height="44" rx="16" fill="#345CFF" opacity="1" filter="url(#shadow)"/><text x="26" y="30" font-family="Inter,Arial" font-size="22" font-weight="800" fill="#fff">7 Measurement Layer</text><rect x="0" y="58" width="760" height="44" rx="16" fill="#0F8F72" opacity="1" filter="url(#shadow)"/><text x="26" y="88" font-family="Inter,Arial" font-size="22" font-weight="800" fill="#fff">6 Governance Control Plane</text><rect x="0" y="116" width="760" height="44" rx="16" fill="#FFD22E" opacity="1" filter="url(#shadow)"/><text x="26" y="146" font-family="Inter,Arial" font-size="22" font-weight="800" fill="#080A0F">5 Decision Layer</text><rect x="0" y="174" width="760" height="44" rx="16" fill="#ffffff" opacity="0.96" filter="url(#shadow)"/><text x="26" y="204" font-family="Inter,Arial" font-size="22" font-weight="800" fill="#080A0F">4 Agent Layer</text><rect x="0" y="232" width="760" height="44" rx="16" fill="#ffffff" opacity="0.96" filter="url(#shadow)"/><text x="26" y="262" font-family="Inter,Arial" font-size="22" font-weight="800" fill="#080A0F">3 Workflow Layer</text><rect x="0" y="290" width="760" height="44" rx="16" fill="#ffffff" opacity="0.96" filter="url(#shadow)"/><text x="26" y="320" font-family="Inter,Arial" font-size="22" font-weight="800" fill="#080A0F">2 Data + Context Layer</text><rect x="0" y="348" width="760" height="44" rx="16" fill="#ffffff" opacity="0.96" filter="url(#shadow)"/><text x="26" y="378" font-family="Inter,Arial" font-size="22" font-weight="800" fill="#080A0F">1 Source of Truth Layer</text>
  </g>
  <g transform="translate(930 270)">
    <circle cx="95" cy="95" r="95" fill="white" filter="url(#shadow)"/>
    <text x="38" y="88" class="h2">GOVERN</text>
    <text x="58" y="123" class="h2" fill="#0F8F72">ASSURE</text>
  </g>

</svg>